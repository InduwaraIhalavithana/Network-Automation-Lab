# Pushes a new Netplan config to every host in [servers] and applies it.
# Run from the control node:  ansible-playbook -i inventory.ini playbook.yml -K
- name: Configure network automatically
  hosts: servers
  become: true
  tasks:
    - name: Push Netplan config
      ansible.builtin.copy:
        src: 99-static.yaml
        dest: /etc/netplan/99-static.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Apply config

  # Runs only when the file above actually changed, so a second run reports changed=0.
  handlers:
    - name: Apply config
      ansible.builtin.command: netplan apply
      changed_when: true
